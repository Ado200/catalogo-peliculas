  .pildora:hover, select:hover { transform:translateY(-1px); }

  @keyframes entrarChip { from { opacity:0; transform:scale(.8); } to { opacity:1; transform:scale(1); } }

  #app { display:none; }

  .destacados { max-width:1100px; margin:20px auto 0; padding:0 20px; }
  .destacados h3 { margin:0 0 12px; font-size:18px; color:var(--texto); }
  .carrusel { display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x mandatory; }
  .carrusel .dest { flex:0 0 150px; scroll-snap-align:start; cursor:pointer; transition:transform .25s var(--ease); }

function esc(x) {
  return String(x == null ? "" : x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function generosDe(p) { return String(p.genero || "").split(",").map(s => s.trim()).filter(Boolean); }

function minutos(p) {
  const s = String(p.duracion || "");
  const h = s.match(/(\d+)\s*h/);
  const m = s.match(/(\d+)\s*min/);
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}

function enRangoDuracion(p, valor) {
  if (!valor) return true;
  const m = minutos(p);
  if (valor === "corta") return m > 0 && m < 90;
  if (valor === "media") return m >= 90 && m <= 120;

}

/* ---------- Marcas personales en la carpeta privada de Drive ---------- */
function marcasLocales() {
  try { return JSON.parse(localStorage.getItem("catalogo_estado") || "{}"); } catch (e) { return {}; }
}

async function driveFetch(url, opts = {}) {
  const headers = Object.assign({ Authorization: "Bearer " + accessToken }, opts.headers || {});
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if (!r.ok) throw new Error("Drive respondió " + r.status);
  return r;
}

async function cargarMarcas() {
  try {
    const q = encodeURIComponent("name='marcas.json'");
    const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);
    const j = await r.json();
    if (j.files && j.files.length) {
      idMarcas = j.files[0].id;
      const c = await driveFetch(`https://www.googleapis.com/drive/v3/files/${idMarcas}?alt=media`);
      marcas = await c.json();
    } else {
      marcas = marcasLocales();
      await guardarMarcasDrive();
    }
  } catch (e) {
    marcas = marcasLocales();
    $("estadoGuardado").textContent = "No pude leer tus marcas de Drive; usando las del navegador.";
  }
}

async function guardarMarcasDrive() {
  const cuerpo = JSON.stringify(marcas);
  try {
    if (idMarcas) {
      await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${idMarcas}?uploadType=media`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: cuerpo
      });
    } else {
      const frontera = "marcas_frontera";
      const meta = JSON.stringify({ name: "marcas.json", parents: ["appDataFolder"] });
      const partes = `--${frontera}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n` +
        `--${frontera}\r\nContent-Type: application/json\r\n\r\n${cuerpo}\r\n--${frontera}--`;
      const r = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { "Content-Type": `multipart/related; boundary=${frontera}` },
        body: partes
      });
      const j = await r.json();
      idMarcas = j.id;
    }
    $("estadoGuardado").textContent = "Marcas guardadas en tu Drive";
  } catch (e) {
    $("estadoGuardado").textContent = "No se pudieron guardar las marcas. Revisa tu conexión.";
  }
  try { localStorage.setItem("catalogo_estado", JSON.stringify(marcas)); } catch (e) {}
}

function programarGuardado() {
  clearTimeout(guardadoTimer);
  guardadoTimer = setTimeout(guardarMarcasDrive, 600);
}

function estadoDe(p) {
  const o = marcas[p.titulo] || {};
  return { vista: !!o.vista, pendiente: !!o.pendiente, estrellas: o.estrellas || 0 };

function cambiarEstado(titulo, cambios) {
  marcas[titulo] = Object.assign({}, marcas[titulo] || {}, cambios);

function controlesHtml(p) {

    '<span class="estrellas">' + estrellas + '</span></div>';
}

function contarEstados() {
  let vistas = 0, pendientes = 0;
  peliculas.forEach(p => {

    if (s.vista) vistas++;
    if (s.pendiente) pendientes++;
  });
  return { vistas, pendientes };
}

/* ---------- Posición del sol ---------- */
const RAD = Math.PI / 180;

function datosSolares(fecha) {
  const diaAnio = Math.floor((fecha - new Date(fecha.getFullYear(), 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (diaAnio - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
    - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
    - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  return { eq, dec };
}

function alturaSol(fecha, lat, lon) {
  const { eq, dec } = datosSolares(fecha);
  const minUTC = fecha.getUTCHours() * 60 + fecha.getUTCMinutes() + fecha.getUTCSeconds() / 60;
  const minSolar = minUTC + 4 * lon + eq;
  const H = (minSolar - 720) / 4 * RAD;
  const latR = lat * RAD;
  const seno = Math.sin(latR) * Math.sin(dec) + Math.cos(latR) * Math.cos(dec) * Math.cos(H);
  return Math.asin(Math.max(-1, Math.min(1, seno))) / RAD;
}

function horasSolares(fecha, lat, lon) {
  const { eq, dec } = datosSolares(fecha);
  const latR = lat * RAD;
  const coseno = Math.cos(90.833 * RAD) / (Math.cos(latR) * Math.cos(dec)) - Math.tan(latR) * Math.tan(dec);
  if (coseno < -1 || coseno > 1) return null;
  const mitad = Math.acos(coseno) / RAD;
  const medioDiaUTC = 720 - 4 * lon - eq;
  const base = Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  return {
    amanecer: new Date(base + (medioDiaUTC - 4 * mitad) * 60000),
    atardecer: new Date(base + (medioDiaUTC + 4 * mitad) * 60000)
  };
}

/* ---------- Tema claro u oscuro ---------- */
function oscuroDelSistema() {
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

function esOscuroPorSol() {
  const ahora = new Date();
  const h = horasSolares(ahora, ubicacion.lat, ubicacion.lon);
  if (!h) return false;
  return ahora < h.amanecer || ahora >= h.atardecer;
}

function esOscuroPorHora() {
  const h = new Date().getHours();
  return h >= 19 || h < 7;
}

function decidirOscuro(modo) {
  if (modo === "claro") return false;
  if (modo === "oscuro") return true;
  if (modo === "hora") return esOscuroPorHora();
  if (modo === "sol") return esOscuroPorSol();
  return oscuroDelSistema();
}

function actualizarTema() {
  document.body.classList.toggle("oscuro", decidirOscuro($("tema-modo").value));
}

function modoGuardado(clave, defecto) {
  try { return localStorage.getItem(clave) || defecto; } catch (e) { return defecto; }
}

/* ---------- Protección de la vista ---------- */
function intensidadPorSol() {
  const alt = alturaSol(new Date(), ubicacion.lat, ubicacion.lon);
  const t = (4 - alt) / 10;
  return Math.max(0, Math.min(1, t));
}

const INTENSIDAD_MAXIMA = 0.28;

function actualizarCalido() {
  const modo = $("vista-modo").value;
  let opacidad = 0;
  if (modo === "siempre") opacidad = INTENSIDAD_MAXIMA;
  else if (modo === "auto") opacidad = intensidadPorSol() * INTENSIDAD_MAXIMA;
  $("calido").style.opacity = opacidad.toFixed(3);
}

function actualizarTodo() {
  actualizarTema();
  actualizarCalido();
}

function pedirUbicacion() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      ubicacion = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      actualizarTodo();
    },
    () => {},
    { timeout: 8000, maximumAge: 86400000 }
  );
}

/* ---------- Sugerencias de búsqueda ---------- */
function llenarSugerencias() {
  const nombres = new Set();
  peliculas.forEach(p => {
    nombres.add(p.titulo);
    personasDe(p).forEach(n => nombres.add(n));
  });
  const dl = $("sugerencias");
  dl.innerHTML = [...nombres].sort((a, b) => a.localeCompare(b, "es"))
    .map(n => '<option value="' + esc(n) + '"></option>').join("");
}

/* ---------- Filtros y render ---------- */
function llenarFiltros() {
  const llenar = (el, arr) => [...new Set(arr.filter(x => x))].sort().forEach(x => el.add(new Option(x, x)));
  llenar(sel.tipo, peliculas.map(p => p.tipo));
  llenar(sel.genero, peliculas.flatMap(generosDe));
  llenar(sel.anio, peliculas.map(p => String(p["año"] || "")));
  llenar(sel.pais, peliculas.map(p => p.pais));

  const conteo = {};
  peliculas.flatMap(temasDe).forEach(t => conteo[t] = (conteo[t] || 0) + 1);
  Object.keys(conteo).sort().forEach(t => sel.tema.add(new Option(`${t} (${conteo[t]})`, t)));
}

function pastillasHtml(p) {
  return temasDe(p).map(t => '<span class="pastilla tema">' + esc(t) + '</span>').join("");
}

function retraso(i) { return "--retraso:" + Math.min(i * 40, 400) + "ms"; }

function tarjeta(p, i) {
  const portada = p.portada ? '<img class="portada" src="' + esc(p.portada) + '" alt="">' : '<div class="sinportada">🎬</div>';
  return '<article class="tarjeta animar" style="' + retraso(i) + '" data-i="' + i + '">' + portada +
    '<h2>' + esc(p.titulo) + '</h2>' +
    '<div class="meta">' + esc(p.tipo) + ' · ' + esc(p["año"]) + ' · ' + esc(p.duracion) + ' · ' + esc(p.pais) + '</div>' +
    '<div class="meta">Género: ' + esc(p.genero) + '</div>' +
    '<div class="meta">Dirección: ' + esc(p.director) + '</div>' +
    '<div class="pastillas">' + pastillasHtml(p) + '</div>' +
    controlesHtml(p) +
    '<p class="sinopsis">' + esc(p.sinopsis) + '</p>' +
    '<a class="boton" href="' + esc(p.link) + '" target="_blank" rel="noopener">Ver</a></article>';
}

function filaHtml(p, i) {
  return '<article class="fila animar" style="' + retraso(i) + '" data-i="' + i + '"><div class="info">' +
    '<h2>' + esc(p.titulo) + '</h2>' +
    '<div class="meta">' + esc(p.tipo) + ' · ' + esc(p["año"]) + ' · ' + esc(p.duracion) + ' · ' + esc(p.pais) + '</div>' +
    '<div class="pastillas">' + pastillasHtml(p) + '</div>' +
    controlesHtml(p) +
    '</div>' +
    '<a class="boton" href="' + esc(p.link) + '" target="_blank" rel="noopener">Ver</a></article>';
}

function renderDestacados() {
  const recientes = [...peliculas]
    .filter(p => Number(p["año"]))
    .sort((a, b) => Number(b["año"]) - Number(a["año"]))
    .slice(0, 6);

  $("carrusel").innerHTML = recientes.map(p => {
    const idx = peliculas.indexOf(p);
    const img = p.portada
      ? '<img src="' + esc(p.portada) + '" alt="">'
      : '<div class="sinportada-mini">🎬</div>';
    return '<div class="dest" data-idx="' + idx + '">' + img +
      '<div class="dest-titulo">' + esc(p.titulo) + '</div>' +
      '<div class="dest-anio">' + esc(p["año"]) + '</div></div>';
  }).join("");
}

function hayFiltros() {
  return buscar.value.trim() !== "" || Object.values(sel).some(s => s.value !== "");
}

function textoOpcion(select) {
  const opt = select.options[select.selectedIndex];
  return opt ? opt.text.replace(/\s*\(\d+\)$/, "") : select.value;
}

function renderChips() {
  const activos = [];
  if (buscar.value.trim()) activos.push({ clave:"buscar", texto:'Búsqueda: "' + buscar.value.trim() + '"' });
  Object.keys(sel).forEach(k => {
    if (sel[k].value) activos.push({ clave:k, texto:etiquetas[k] + ": " + textoOpcion(sel[k]) });
  });
  chips.innerHTML = activos.map(a =>
    '<span class="chip" data-clave="' + a.clave + '">' + esc(a.texto) + '<span>×</span></span>'
  ).join("");
}

function coincideEstado(p, valor) {
  if (!valor) return true;
  const s = estadoDe(p);
  if (valor === "vista") return s.vista;
  if (valor === "sin_ver") return !s.vista;
  if (valor === "pendiente") return s.pendiente;
  if (valor === "favoritas") return s.estrellas >= 4;
  return true;
}

function renderAgrupado() {
  const temas = [...new Set(visibles.flatMap(temasDe))].sort((a, b) => a.localeCompare(b, "es"));
  const bloques = temas.map(t => {
    const grupo = visibles.filter(p => temasDe(p).includes(t));
    return { nombre: t, items: grupo };
  });
  const sinTema = visibles.filter(p => temasDe(p).length === 0);
  if (sinTema.length) bloques.push({ nombre: "Sin tema", items: sinTema });

  return bloques.map(b => {
    const cuerpo = b.items.map((p, k) => vistaLista ? filaHtml(p, k) : tarjeta(p, k)).join("");
    return '<section class="grupo"><h3>' + esc(b.nombre) + ' (' + b.items.length + ')</h3>' +
      '<div class="grupo-items">' + cuerpo + '</div></section>';
  }).join("");
}

function pintar() {
  const f = buscar.value.trim().toLowerCase();
  visibles = peliculas.filter(p => {
    const texto = [p.titulo, p.director, p.reparto].join(" ").toLowerCase();
    return texto.includes(f) &&
      (!sel.tipo.value || p.tipo === sel.tipo.value) &&
      (!sel.genero.value || generosDe(p).includes(sel.genero.value)) &&
      (!sel.tema.value || temasDe(p).includes(sel.tema.value)) &&
      (!sel.anio.value || String(p["año"]) === sel.anio.value) &&
      (!sel.pais.value || p.pais === sel.pais.value) &&
      enRangoDuracion(p, sel.duracion.value) &&
      coincideEstado(p, sel.estado.value);
  });
  visibles.sort(ordenes[$("orden").value]);

  const { vistas, pendientes } = contarEstados();
  $("destacados").style.display = hayFiltros() ? "none" : "block";
  renderChips();
  contador.textContent = visibles.length + " de " + peliculas.length + " títulos · " +
    vistas + " vistas · " + pendientes + " pendientes";

  if (!visibles.length) {
    lista.innerHTML = '<p class="vacio">No encontré nada con esos criterios.</p>';
    return;
  }
  if (agrupado) {
    lista.innerHTML = renderAgrupado();
    return;
  }
  lista.innerHTML = visibles.map((p, i) => vistaLista ? filaHtml(p, i) : tarjeta(p, i)).join("");
}

/* ---------- Detalle con tráiler en español o inglés ---------- */
function iframeTrailer(codigo, titulo) {
  return '<iframe src="https://www.youtube.com/embed/' + esc(codigo) + '" title="Tráiler de ' + esc(titulo) + '" ' +
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
    'allowfullscreen loading="lazy"></iframe>';
}

function bloqueTrailer(p) {
  const es = String(p.trailer_es || "").trim();
  const en = String(p.trailer_en || "").trim();
  const hayEs = es && es !== "sin tráiler";
  const hayEn = en && en !== "sin tráiler";

  if (!hayEs && !hayEn) {
    return '<div class="trailer"><div class="trailer-vacio">Esta película no tiene tráiler disponible.</div></div>';
  }

  const principal = hayEs ? es : en;
  let opciones = "";
  if (hayEs && hayEn) {
    opciones = '<div class="trailer-opciones">' +
      '<button class="chipc activo" data-trailer="es" data-codigo="' + esc(es) + '">Español</button>' +
      '<button class="chipc" data-trailer="en" data-codigo="' + esc(en) + '">Inglés</button>' +
      '</div>';
  }
  return '<div class="trailer"><div class="trailer-titulo">Tráiler</div>' + opciones +
    '<div class="trailer-caja" id="trailerCaja">' + iframeTrailer(principal, p.titulo) + '</div></div>';
}

function abrirDetalle(p) {
  $("detalle").innerHTML =
    (p.portada ? '<img class="portada" src="' + esc(p.portada) + '" alt="">' : '') +
    '<h2>' + esc(p.titulo) + '</h2>' +
    '<div class="meta">' + esc(p.tipo) + ' · ' + esc(p["año"]) + ' · ' + esc(p.duracion) + ' · ' + esc(p.pais) + '</div>' +
    '<div class="meta">Género: ' + esc(p.genero) + '</div>' +
    '<div class="meta">Dirección: ' + esc(p.director) + '</div>' +
    '<div class="meta">Reparto: ' + esc(p.reparto) + '</div>' +
    '<div class="pastillas">' + pastillasHtml(p) + '</div>' +
    controlesHtml(p) +
    '<p class="sinopsis">' + esc(p.sinopsis) + '</p>' +
    bloqueTrailer(p) +
    '<a class="boton" href="' + esc(p.link) + '" target="_blank" rel="noopener">Ver película</a>';

  $("otra").innerHTML = desdeAleatorio
    ? '<button class="pildora destacado" id="otraSugerencia">🎲 Otra sugerencia</button>'
    : '';
  $("modal").classList.add("abierto");
}

function cerrarDetalle() {
  $("modal").classList.remove("abierto");
  $("detalle").innerHTML = "";
  desdeAleatorio = false;
  $("otra").innerHTML = "";
}

function sugerirAleatoria() {
  if (!visibles.length) {
    contador.textContent = "No hay películas con esos criterios para sugerir.";
    return;
  }
  let p = visibles[Math.floor(Math.random() * visibles.length)];
  const actual = $("detalle").querySelector("h2")?.textContent;
  if (visibles.length > 1 && p.titulo === actual) {
    p = visibles[(visibles.indexOf(p) + 1) % visibles.length];
  }
  desdeAleatorio = true;
  abrirDetalle(p);
}

function refrescarTodo() {
  pintar();
  if ($("modal").classList.contains("abierto")) {
    const actual = peliculas.find(p => p.titulo === $("detalle").querySelector("h2")?.textContent);
    if (actual) abrirDetalle(actual);
  }
}

function mostrarError(msg) {
  $("error").textContent = msg;
  $("btnLogin").disabled = false;
  $("btnLogin").textContent = "Iniciar sesión con Google";
}

async function cargarHoja() {
  try {
    const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${HOJA_ID}/values/A:Z`, {
      headers: { Authorization: "Bearer " + accessToken }
    });
    const json = await r.json();
    if (!r.ok) throw new Error(json.error?.message || "No se pudo leer la hoja.");

    const filas = json.values || [];
    const enc = filas[0] || [];
    peliculas = filas.slice(1).filter(f => f[0]).map(f => {
      const o = {};
      enc.forEach((n, i) => o[n] = f[i] ?? "");
      return o;
    });

    $("login").style.display = "none";
    $("app").style.display = "block";
    llenarFiltros();
    llenarSugerencias();
    renderDestacados();
    pintar();
  } catch (e) {
    mostrarError(e.message);
  }
}

async function iniciarApp() {
  await cargarMarcas();
  await cargarHoja();
}

window.addEventListener("load", () => {
  $("tema-modo").value = modoGuardado("tema_modo", "sistema");
  $("vista-modo").value = modoGuardado("vista_modo", "auto");
  actualizarTodo();
  pedirUbicacion();
  setInterval(actualizarTodo, 60000);

  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const alCambiar = () => actualizarTema();
    if (mq.addEventListener) mq.addEventListener("change", alCambiar);
    else if (mq.addListener) mq.addListener(alCambiar);
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: resp => {
      if (resp.access_token) {
        accessToken = resp.access_token;
        iniciarApp();
      } else {
        mostrarError("No se pudo iniciar sesión.");
      }
    }
  });

  $("btnLogin").addEventListener("click", () => {
    $("btnLogin").disabled = true;
    $("btnLogin").textContent = "Cargando películas...";
    tokenClient.requestAccessToken();
  });

  $("tema-modo").addEventListener("change", () => {
    try { localStorage.setItem("tema_modo", $("tema-modo").value); } catch (e) {}
    actualizarTema();
  });

  $("vista-modo").addEventListener("change", () => {
    try { localStorage.setItem("vista_modo", $("vista-modo").value); } catch (e) {}
    actualizarCalido();
  });

  [buscar, sel.tipo, sel.genero, sel.tema, sel.anio, sel.pais, sel.duracion, sel.estado, $("orden")]
    .forEach(el => el.addEventListener("input", pintar));

  chips.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const clave = chip.dataset.clave;
    if (clave === "buscar") buscar.value = "";
    else sel[clave].value = "";
    pintar();
  });

  lista.addEventListener("click", e => {
    if (e.target.closest("a, [data-accion]")) return;
    const card = e.target.closest("[data-i]");
    if (card) {
      desdeAleatorio = false;
      abrirDetalle(visibles[Number(card.dataset.i)]);
    }
  });

  $("carrusel").addEventListener("click", e => {
    const d = e.target.closest("[data-idx]");
    if (d) {
      desdeAleatorio = false;
      abrirDetalle(peliculas[Number(d.dataset.idx)]);
    }
  });

  document.addEventListener("click", e => {
    if (e.target.id === "otraSugerencia") { sugerirAleatoria(); return; }

    // Cambiar entre tráiler en español e inglés
    const idioma = e.target.closest("[data-trailer]");
    if (idioma) {
      const caja = $("trailerCaja");
      const titulo = $("detalle").querySelector("h2")?.textContent || "";
      caja.innerHTML = iframeTrailer(idioma.dataset.codigo, titulo);
      document.querySelectorAll("[data-trailer]").forEach(b => b.classList.toggle("activo", b === idioma));
      return;
    }

    const b = e.target.closest("[data-accion]");
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();

    const titulo = b.dataset.clave;
    const p = peliculas.find(x => x.titulo === titulo);
    if (!p) return;
    const s = estadoDe(p);

    if (b.dataset.accion === "vista") {
      cambiarEstado(titulo, { vista: !s.vista, pendiente: false });
    } else if (b.dataset.accion === "pendiente") {
      cambiarEstado(titulo, { pendiente: !s.pendiente, vista: false });
    } else if (b.dataset.accion === "estrella") {
      const n = Number(b.dataset.n);
      cambiarEstado(titulo, { estrellas: s.estrellas === n ? 0 : n });
    }
    refrescarTodo();
  });

  $("aleatorio").addEventListener("click", sugerirAleatoria);

  $("cerrarModal").addEventListener("click", cerrarDetalle);
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") cerrarDetalle(); });

  $("vista").addEventListener("click", () => {
    vistaLista = !vistaLista;
    document.body.classList.toggle("lista", vistaLista);
    $("vista").textContent = vistaLista ? "Ver con portadas" : "Ver como lista";
    pintar();
  });

  $("agrupar").addEventListener("click", () => {
    agrupado = !agrupado;
    $("agrupar").textContent = agrupado ? "Quitar agrupación" : "Agrupar por tema";
    pintar();
  });

  $("limpiar").addEventListener("click", () => {
    buscar.value = "";
    Object.values(sel).forEach(s => s.value = "");
    $("orden").value = "titulo";
    pintar();
  });
});
</script>
