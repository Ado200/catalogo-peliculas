<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi catálogo de películas</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --fondo:#f5f5f7; --tarjeta:#ffffff; --texto:#1d1d1f; --gris:#6e6e73;
    --azul:#0071e3; --borde:#d2d2d7; --boton-suave:#e8e8ed;
    --tema-bg:rgba(0,113,227,.1); --tema-texto:#0071e3;
    --sombra:0 2px 10px rgba(0,0,0,.06); --error:#c00; --estrella:#ffb800;
  }
  body.oscuro {
    --fondo:#000000; --tarjeta:#1c1c1e; --texto:#f5f5f7; --gris:#a1a1a6;
    --azul:#0a84ff; --borde:#3a3a3c; --boton-suave:#2c2c2e;
    --tema-bg:rgba(10,132,255,.18); --tema-texto:#64b5ff;
    --sombra:0 2px 10px rgba(0,0,0,.5); --error:#ff6961; --estrella:#ffd60a;
  }

  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fondo); color:var(--texto); transition:background .25s, color .25s; }
  header { padding:28px 20px 10px; text-align:center; }
  h1 { margin:0 0 16px; font-size:26px; }
  #buscar { width:min(560px,100%); padding:14px 18px; font-size:16px; border:1px solid var(--borde); border-radius:999px; outline:none; background:var(--tarjeta); color:var(--texto); }
  .filtros { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px; }
  select, .pildora { padding:10px 14px; font-size:14px; border:1px solid var(--borde); border-radius:999px; background:var(--tarjeta); color:var(--texto); }
  .pildora { background:var(--boton-suave); border:none; cursor:pointer; }
  .boton-login { background:var(--azul); color:#fff; border:none; padding:14px 28px; font-size:16px; cursor:pointer; border-radius:999px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; min-height:4px; }
  .chip { background:var(--azul); color:#fff; font-size:13px; padding:6px 10px 6px 14px; border-radius:999px; cursor:pointer; }
  .chip span { margin-left:6px; opacity:.8; }
  #contador { color:var(--gris); font-size:14px; margin-top:12px; }
  #error { color:var(--error); margin-top:12px; }
  #login { text-align:center; margin-top:60px; }
  #app { display:none; }

  .destacados { max-width:1100px; margin:20px auto 0; padding:0 20px; }
  .destacados h3 { margin:0 0 12px; font-size:18px; color:var(--texto); }
  .carrusel { display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x mandatory; }
  .carrusel .dest { flex:0 0 150px; scroll-snap-align:start; cursor:pointer; }
  .carrusel img, .carrusel .sinportada-mini { width:150px; height:225px; object-fit:cover; border-radius:14px; box-shadow:var(--sombra); display:block; }
  .carrusel .sinportada-mini { background:var(--tarjeta); font-size:44px; display:flex; align-items:center; justify-content:center; }
  .carrusel .dest-titulo { font-size:13px; margin-top:8px; line-height:1.3; }
  .carrusel .dest-anio { font-size:12px; color:var(--gris); }

  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; padding:20px; max-width:1100px; margin:auto; }
  body.lista main { grid-template-columns:1fr; max-width:900px; }
  .tarjeta, .fila { background:var(--tarjeta); border-radius:18px; cursor:pointer; box-shadow:var(--sombra); transition:transform .2s; }
  .tarjeta { padding:20px; }
  .tarjeta:hover, .fila:hover { transform:translateY(-2px); }
  .tarjeta h2 { margin:10px 0 4px; font-size:19px; }
  .portada { width:100%; border-radius:12px; }
  .sinportada { font-size:40px; }
  .meta { color:var(--gris); font-size:14px; margin-bottom:6px; }
  .sinopsis { font-size:14px; line-height:1.45; }
  .pastillas { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .pastilla { font-size:12px; padding:4px 10px; border-radius:999px; }
  .pastilla.tema { background:var(--tema-bg); color:var(--tema-texto); }
  .boton { display:inline-block; background:var(--azul); color:#fff; text-decoration:none; padding:9px 18px; border-radius:999px; font-size:14px; }
  .fila { padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .fila .info { flex:1; min-width:220px; }
  .fila h2 { margin:0 0 4px; font-size:17px; }
  .vacio { text-align:center; color:var(--gris); grid-column:1/-1; }

  .grupo { grid-column:1/-1; }
  .grupo h3 { margin:10px 0 12px; font-size:18px; }
  .grupo-items { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; }
  body.lista .grupo-items { grid-template-columns:1fr; }

  .controles { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .chipc { border:1px solid var(--borde); background:var(--tarjeta); color:var(--texto); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chipc.activo { background:var(--azul); color:#fff; border-color:var(--azul); }
  .estrellas { display:inline-flex; gap:2px; margin-left:4px; }
  .estrella { background:none; border:none; font-size:20px; cursor:pointer; color:var(--borde); padding:0 1px; }
  .estrella.on { color:var(--estrella); }

  #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:20px; z-index:10; }
  #modal.abierto { display:flex; }
  .ventana { background:var(--tarjeta); color:var(--texto); border-radius:18px; padding:24px; max-width:560px; width:100%; max-height:90vh; overflow:auto; position:relative; }
  .ventana h2 { margin:0 0 6px; font-size:22px; }
  .cerrar { position:absolute; top:12px; right:14px; background:none; border:none; font-size:26px; cursor:pointer; color:var(--gris); }
  .ventana .sinopsis { font-size:15px; margin:14px 0; }
  .ventana .portada { max-width:200px; margin-bottom:12px; }
</style>
</head>
<body>

<div id="login">
  <h1>Mi catálogo de películas</h1>
  <button id="btnLogin" class="boton-login">Iniciar sesión con Google</button>
  <div id="error"></div>
</div>

<div id="app">
<header>
  <h1>Mi catálogo de películas</h1>
  <input id="buscar" type="search" list="sugerencias" placeholder="Busca por título, director o actor">
  <datalist id="sugerencias"></datalist>
  <div class="filtros">
    <select id="tipo"><option value="">Películas y series</option></select>
    <select id="genero"><option value="">Todos los géneros</option></select>
    <select id="tema"><option value="">Todos los temas</option></select>
    <select id="anio"><option value="">Todos los años</option></select>
    <select id="pais"><option value="">Todos los países</option></select>
    <select id="duracion">
      <option value="">Cualquier duración</option>
      <option value="corta">Menos de 1 h 30 min</option>
      <option value="media">De 1 h 30 a 2 h</option>
      <option value="larga">Más de 2 h</option>
    </select>
    <select id="estado">
      <option value="">Todas las películas</option>
      <option value="vista">Vistas</option>
      <option value="sin_ver">Sin ver</option>
      <option value="pendiente">Pendientes</option>
      <option value="favoritas">Favoritas (4 o 5★)</option>
    </select>
    <select id="orden">
      <option value="titulo">Ordenar: A a Z</option>
      <option value="recientes">Ordenar: más recientes</option>
      <option value="antiguas">Ordenar: más antiguas</option>
      <option value="duracion">Ordenar: más largas</option>
    </select>
    <button id="vista" class="pildora">Ver como lista</button>
    <button id="agrupar" class="pildora">Agrupar por tema</button>
    <button id="tema-btn" class="pildora">Modo oscuro</button>
    <button id="limpiar" class="pildora">Limpiar</button>
  </div>
  <div id="chips"></div>
  <div id="contador"></div>
</header>

<section id="destacados" class="destacados">
  <h3>Estrenos recientes</h3>
  <div id="carrusel" class="carrusel"></div>
</section>

<main id="lista"></main>
</div>

<div id="modal">
  <div class="ventana">
    <button class="cerrar" id="cerrarModal">×</button>
    <div id="detalle"></div>
  </div>
</div>

<script>
const CLIENT_ID = "45846987194-cm8mnhijljms8k8u8j44n8aeq674vuis.apps.googleusercontent.com";
const HOJA_ID = "1W5oSA5yy4TpbVYxjya6S9T6NkeE6irwSHABXFAijO2k";

let peliculas = [];
let visibles = [];
let tokenClient;
let vistaLista = false;
let agrupado = false;

const $ = id => document.getElementById(id);
const lista = $("lista"), buscar = $("buscar"), contador = $("contador"), chips = $("chips");
const sel = { tipo:$("tipo"), genero:$("genero"), tema:$("tema"), anio:$("anio"), pais:$("pais"), duracion:$("duracion"), estado:$("estado") };
const etiquetas = { tipo:"Tipo", genero:"Género", tema:"Tema", anio:"Año", pais:"País", duracion:"Duración", estado:"Estado" };

function esc(x) {
  return String(x == null ? "" : x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function generosDe(p) { return String(p.genero || "").split(",").map(s => s.trim()).filter(Boolean); }
function temasDe(p) { return String(p.temas || "").split(";").map(s => s.trim()).filter(Boolean); }
function personasDe(p) {
  return [...String(p.director || "").split(","), ...String(p.reparto || "").split(",")]
    .map(s => s.trim()).filter(Boolean);
}

function minutos(p) {
  const s = String(p.duracion || "");
  const h = s.match(/(\d+)\s*h/);
  const m = s.match(/(\d+)\s*min/);
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}

function enRangoDuracion(p, valor) {
  if (!valor) return true;
  const m = minutos(p);
  if (valor === "corta") return m > 0 && m < 90;
  if (valor === "media") return m >= 90 && m <= 120;
  if (valor === "larga") return m > 120;
  return true;
}

const ordenes = {
  titulo: (a, b) => String(a.titulo).localeCompare(String(b.titulo), "es"),
  recientes: (a, b) => (Number(b["año"]) || 0) - (Number(a["año"]) || 0),
  antiguas: (a, b) => (Number(a["año"]) || 0) - (Number(b["año"]) || 0),
  duracion: (a, b) => minutos(b) - minutos(a)
};

/* ---------- Estado personal: vista, pendiente y estrellas ---------- */
function leerEstado() {
  try { return JSON.parse(localStorage.getItem("catalogo_estado") || "{}"); } catch (e) { return {}; }
}
function guardarEstado(todo) {
  try { localStorage.setItem("catalogo_estado", JSON.stringify(todo)); } catch (e) {}
}
function estadoDe(p) {
  const o = leerEstado()[p.titulo] || {};
  return { vista: !!o.vista, pendiente: !!o.pendiente, estrellas: o.estrellas || 0 };
}
function cambiarEstado(titulo, cambios) {
  const todo = leerEstado();
  todo[titulo] = Object.assign({}, todo[titulo] || {}, cambios);
  guardarEstado(todo);
}

function controlesHtml(p) {
  const s = estadoDe(p);
  const k = esc(p.titulo);
  let estrellas = "";
  for (let n = 1; n <= 5; n++) {
    estrellas += '<button class="estrella' + (n <= s.estrellas ? ' on' : '') + '" data-accion="estrella" data-clave="' + k + '" data-n="' + n + '">★</button>';
  }
  return '<div class="controles">' +
    '<button class="chipc' + (s.vista ? ' activo' : '') + '" data-accion="vista" data-clave="' + k + '">' + (s.vista ? '✓ Vista' : 'Marcar vista') + '</button>' +
    '<button class="chipc' + (s.pendiente ? ' activo' : '') + '" data-accion="pendiente" data-clave="' + k + '">' + (s.pendiente ? '⏳ En pendientes' : 'Pendiente') + '</button>' +
    '<span class="estrellas">' + estrellas + '</span></div>';
}

function contarEstados() {
  let vistas = 0, pendientes = 0;
  peliculas.forEach(p => {
    const s = estadoDe(p);
    if (s.vista) vistas++;
    if (s.pendiente) pendientes++;
  });
  return { vistas, pendientes };
}

/* ---------- Modo oscuro ---------- */
function aplicarTema(oscuro) {
  document.body.classList.toggle("oscuro", oscuro);
  $("tema-btn").textContent = oscuro ? "Modo claro" : "Modo oscuro";
}
function iniciarTema() {
  let guardado = null;
  try { guardado = localStorage.getItem("tema"); } catch (e) {}
  const oscuro = guardado ? guardado === "oscuro"
    : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  aplicarTema(oscuro);
}
function alternarTema() {
  const oscuro = !document.body.classList.contains("oscuro");
  aplicarTema(oscuro);
  try { localStorage.setItem("tema", oscuro ? "oscuro" : "claro"); } catch (e) {}
}

/* ---------- Sugerencias de búsqueda ---------- */
function llenarSugerencias() {
  const nombres = new Set();
  peliculas.forEach(p => {
    nombres.add(p.titulo);
    personasDe(p).forEach(n => nombres.add(n));
  });
  const dl = $("sugerencias");
  dl.innerHTML = [...nombres].sort((a, b) => a.localeCompare(b, "es"))
    .map(n => '<option value="' + esc(n) + '"></option>').join("");
}

/* ---------- Filtros y render ---------- */
function llenarFiltros() {
  const llenar = (el, arr) => [...new Set(arr.filter(x => x))].sort().forEach(x => el.add(new Option(x, x)));
  llenar(sel.tipo, peliculas.map(p => p.tipo));
  llenar(sel.genero, peliculas.flatMap(generosDe));
  llenar(sel.anio, peliculas.map(p => String(p["año"] || "")));
  llenar(sel.pais, peliculas.map(p => p.pais));

  const conteo = {};
  peliculas.flatMap(temasDe).forEach(t => conteo[t] = (conteo[t] || 0) + 1);
  Object.keys(conteo).sort().forEach(t => sel.tema.add(new Option(`${t} (${conteo[t]})`, t)));
}

function pastillasHtml(p) {
  return temasDe(p).map(t => '<span class="pastilla tema">' + esc(t) + '</span>').join("");
}

function tarjeta(p, i) {
  const portada = p.portada ? '<img class="portada" src="' + esc(p.portada) + '" alt="">' : '<div class="sinportada">🎬</div>';
  return '<article class="tarjeta" data-i="' + i + '">' + portada +
    '<h2>' + esc(p.titulo) + '</h2>' +
    '<div
